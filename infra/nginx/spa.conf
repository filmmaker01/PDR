# Отдача собранного SPA. Корень — симлинк /srv/app: какое приложение отдавать,
# выбирает entrypoint по переменной PROCESS_ROLE, поэтому образ один на оба
# фронтенда.
#
# Порт совпадает с портом API: в Amvera containerPort задаётся в общем для
# репозитория файле конфигурации, один на все приложения.
server {
    listen 3000;
    server_name _;
    root /srv/app;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    include /etc/nginx/pdr-security-headers.conf;

    # Хэш в имени файла делает содержимое неизменяемым.
    location ~* \.(js|css|woff2?|png|jpe?g|svg|webp|ico)$ {
        include /etc/nginx/pdr-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/pdr-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Маршрутизация внутри приложения: любой адрес отдаёт index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
