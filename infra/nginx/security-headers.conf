# Заголовки безопасности. Вынесены в отдельный файл, потому что add_header
# внутри location не дополняет, а заменяет заголовки уровня server: их нужно
# повторять в каждом блоке, где есть собственный add_header.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
# X-Frame-Options не ставится: Mini App открывается внутри WebView Telegram,
# и встраивание разрешает frame-ancestors.
add_header Content-Security-Policy "default-src 'self'; frame-ancestors https://web.telegram.org https://*.telegram.org tg:; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https: wss:; frame-src https://kinescope.io https://*.kinescope.io" always;
