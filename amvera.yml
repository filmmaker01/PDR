# ═══════════════════════════════════════════════════════════════════════════
#  Конфигурация Amvera Cloud.
#
#  Amvera читает один такой файл из корня репозитория, а каждое приложение
#  заводится отдельным проектом. Поэтому файл общий для всех трёх проектов
#  (API, Mini App, админка), образ тоже один, а что именно запускать —
#  решает переменная окружения PROCESS_ROLE, которая задаётся в настройках
#  каждого проекта:
#
#    pdr-api    PROCESS_ROLE=api      API и фоновые задачи
#    pdr-app    PROCESS_ROLE=miniapp  Mini App
#    pdr-admin  PROCESS_ROLE=admin    админка
#
#  Полный список переменных для каждого проекта и порядок запуска —
#  docs/14-deploy-staging.md.
# ═══════════════════════════════════════════════════════════════════════════

meta:
  environment: docker
  toolchain:
    name: docker
    version: latest

build:
  dockerfile: infra/docker/Dockerfile.amvera

run:
  # Постоянное хранилище проекта. Для pdr-api сюда складываются загруженные
  # файлы (STORAGE_LOCAL_DIR=/data/storage), у фронтендов оно не используется.
  persistenceMount: /data
  # Один порт на все роли: и API, и nginx с фронтендами слушают 3000.
  containerPort: 3000
